# tag_tracker — C++ node configuration
# ======================================================
# Anchor tags define the world coordinate frame.
# Use the parallel-array format (anchor_tag_ids / xs / ys / yaws)
# which works reliably with the ROS 2 C++ parameter server.
#
# Minimum anchors needed:
#   1  →  translation only
#   2–3 → similarity (rotation + scale + translation)
#   ≥4  → full homography (most accurate)
#
# Coordinates can be in any consistent unit (e.g. metres, cm).
# ======================================================

tag_tracker_node:
  ros__parameters:

    # ── Camera input ──────────────────────────────────────────────────────
    image_topic:        "/my_camera/pylon_ros2_camera_node/image_rect"
    camera_info_topic:  "/my_camera/pylon_ros2_camera_node/camera_info"

    # ── AprilTag detector ─────────────────────────────────────────────────
    # Families: tag36h11 | tag25h9 | tag16h5 | tagCircle21h7 | tagStandard41h12
    tag_family:       "tag36h11"
    tag_size:          0.08          # physical side length [m] (for 3-D pose)
    detector_threads:  2
    quad_decimate:     1.0           # 1.0 = full resolution; 2.0 = half (faster)

    # ── Publish rate ─────────────────────────────────────────────────────
    # 0.0 = publish on every received frame
    publish_rate: 0.0

    # ── Anchor (fixed) tags ───────────────────────────────────────────────
    # Parallel arrays — one entry per anchor tag.
    anchor_tag_ids:  [3,   4,   5]
    anchor_tag_xs:   [0.1, 0.0, 0.0, 0.0]   # world X [m]
    anchor_tag_ys:   [0.0, 0.0, 0.1, 0.0]   # world Y [m]
    anchor_tag_yaws: [0.0, 0.0, 0.0, 0.0]   # tag orientation [rad]

    # ── Moving tags ───────────────────────────────────────────────────────
    # Leave empty ([]) to track ALL non-anchor tags automatically.
    # Or list specific ids: [10, 11, 12]
    moving_tag_ids: [7,8,9,10,11,12,13,14,15]

    # ── Output ───────────────────────────────────────────────────────────
    # Individual topics: <prefix>/<tag_id>  (geometry_msgs/Pose2D)
    # Combined topic:    <prefix>/all       (geometry_msgs/PoseArray)
    output_topic_prefix: "/tag_tracker/pose"

    # ── Debug image ───────────────────────────────────────────────────────
    publish_debug_image: false
    debug_image_topic:   "/tag_tracker/debug_image"
